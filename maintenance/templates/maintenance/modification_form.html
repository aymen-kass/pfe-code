{% extends 'base.html' %}
{% block content %}
<div id="right-panel" class="right-panel">
	{% include 'header.html' %}
	<div class="content mt-3">
	    <div class="animated fadeIn">
	        <div class="row">
	            <div class="col-md-12" ><!--class="col-lg-6 col-md-12 ">-->
	                <div class="card">
	                    <div class="card-header">
	                    	<strong class="card-title">{{page}}</strong><small></small>
	                    </div>
	                        <div class="card-body">
	                            <form action="#" method="POST" enctype="multipart/form-data">
									{% csrf_token %}
									{{ form }}
									<input type="submit"  class="btn btn-success" value="Confirmer" style="margin-top: 10px;" />
	    							<a class="btn btn-outline-danger" style="margin-top: 10px;">Annuler</a>
								</form>
							</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

{% endblock content %}
